<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .box  { fill:#eaf2fb; stroke:#2f5c8f; stroke-width:1.5; }
    .term { fill:#e8f5e9; stroke:#2e7d32; stroke-width:1.5; }
    .dec  { fill:#fff8e1; stroke:#b28704; stroke-width:1.5; }
    .pan  { fill:#fdf6f0; stroke:#c77d48; stroke-width:1.5; }
    .t    { font-size:15px; fill:#222; }
    .s    { font-size:12.5px; fill:#555; }
    .lbl  { font-size:13px; font-style:italic; fill:#666; }
    .ttl  { font-size:19px; font-weight:bold; fill:#222; }
    .sub  { font-size:14px; font-weight:bold; fill:#8a4b1d; }
    line, polyline { stroke:#444; stroke-width:1.5; fill:none; }
  </style>

  <text class="ttl" x="170" y="32" text-anchor="middle">floor_int(y): greatest whole number &#8804; y</text>

  <ellipse class="term" cx="170" cy="88" rx="105" ry="23"/>
  <text class="t" x="170" y="93" text-anchor="middle">Start: input y</text>
  <line x1="170" y1="111" x2="170" y2="150" marker-end="url(#a)"/>

  <rect class="box" x="60" y="150" width="220" height="60" rx="8"/>
  <text class="t" x="170" y="176" text-anchor="middle">n = y // 1.0</text>
  <text class="s" x="170" y="196" text-anchor="middle">floor division, one arithmetic step</text>
  <line x1="170" y1="210" x2="170" y2="252" marker-end="url(#a)"/>

  <ellipse class="term" cx="170" cy="275" rx="105" ry="23"/>
  <text class="t" x="170" y="280" text-anchor="middle">Return n</text>

  <text class="s" x="170" y="330" text-anchor="middle">No branch is needed: floor division already</text>
  <text class="s" x="170" y="348" text-anchor="middle">rounds toward minus infinity, for every sign of y.</text>

  <rect class="pan" x="315" y="52" width="605" height="386" rx="10"/>

  <text class="sub" x="335" y="80">Why F5 needs the floor</text>
  <text class="t" x="335" y="106">Algorithm B splits the exponent x into a whole part n</text>
  <text class="t" x="335" y="128">and a leftover f in [0, 1):   x = n + f,   n = floor_int(x)</text>
  <text class="t" x="335" y="156">Elodie reads her culture at x = 3.5 h:</text>
  <text class="t" x="355" y="178">n = 3 whole doublings, computed exactly by pow_int</text>
  <text class="t" x="355" y="200">f = 0.5 of a doubling, computed by the series</text>
  <text class="t" x="335" y="228">A reading before time zero, x = &#8722;2.5 h:</text>
  <text class="t" x="355" y="250">floor(&#8722;2.5) = &#8722;3, so f = &#8722;2.5 &#8722; (&#8722;3) = 0.5,</text>
  <text class="t" x="355" y="272">which stays inside [0, 1) as the series requires.</text>

  <text class="sub" x="335" y="308">What changed in D2</text>
  <text class="t" x="335" y="334">D1 used n = int(y), which truncates toward zero:</text>
  <text class="t" x="335" y="356">int(&#8722;2.5) is &#8722;2, not &#8722;3, so a correction step</text>
  <text class="t" x="335" y="378">n = n &#8722; 1 was needed for negative values.</text>
  <text class="t" x="335" y="404">int() is a built-in type conversion, and DC-03 permits</text>
  <text class="t" x="335" y="426">only input, output, arithmetic and interface functions.</text>
</svg>
