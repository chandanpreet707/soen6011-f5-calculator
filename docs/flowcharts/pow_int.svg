<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .box  { fill:#eaf2fb; stroke:#2f5c8f; stroke-width:1.5; }
    .term { fill:#e8f5e9; stroke:#2e7d32; stroke-width:1.5; }
    .dec  { fill:#fff8e1; stroke:#b28704; stroke-width:1.5; }
    .pan  { fill:#fdf6f0; stroke:#c77d48; stroke-width:1.5; }
    .t    { font-size:15px; fill:#222; }
    .s    { font-size:12.5px; fill:#555; }
    .lbl  { font-size:13px; font-style:italic; fill:#666; }
    .ttl  { font-size:19px; font-weight:bold; fill:#222; }
    .sub  { font-size:14px; font-weight:bold; fill:#8a4b1d; }
    .hd   { font-size:13px; font-weight:bold; fill:#5a3517; }
    .cell { font-size:14px; fill:#333; }
    line, polyline { stroke:#444; stroke-width:1.5; fill:none; }
    .rule { stroke:#d9b394; stroke-width:1; }
  </style>

  <text class="ttl" x="180" y="32" text-anchor="middle">pow_int(b, n): exact b to the whole power n</text>

  <ellipse class="term" cx="180" cy="80" rx="128" ry="23"/>
  <text class="t" x="180" y="85" text-anchor="middle">Start: b, whole n &#8805; 0</text>
  <line x1="180" y1="103" x2="180" y2="127" marker-end="url(#a)"/>

  <rect class="box" x="105" y="127" width="150" height="40" rx="8"/>
  <text class="t" x="180" y="152" text-anchor="middle">result = 1.0</text>
  <line x1="180" y1="167" x2="180" y2="193" marker-end="url(#a)"/>

  <polygon class="dec" points="180,193 265,235 180,277 95,235"/>
  <text class="t" x="180" y="240" text-anchor="middle">n &gt; 0 ?</text>

  <polyline points="265,235 470,235 470,608 285,608" marker-end="url(#a)"/>
  <text class="lbl" x="278" y="227">no</text>

  <line x1="180" y1="277" x2="180" y2="303" marker-end="url(#a)"/>
  <text class="lbl" x="190" y="296">yes</text>

  <polygon class="dec" points="180,303 265,345 180,387 95,345"/>
  <text class="t" x="180" y="350" text-anchor="middle">n odd ?</text>

  <line x1="265" y1="345" x2="285" y2="345" marker-end="url(#a)"/>
  <text class="lbl" x="268" y="337">yes</text>
  <rect class="box" x="285" y="324" width="150" height="42" rx="8"/>
  <text class="t" x="360" y="350" text-anchor="middle">result = result &#215; b</text>
  <polyline points="360,366 360,455 180,455"/>

  <line x1="180" y1="387" x2="180" y2="455"/>
  <text class="lbl" x="190" y="410">no</text>
  <line x1="180" y1="455" x2="180" y2="490" marker-end="url(#a)"/>

  <rect class="box" x="90" y="490" width="180" height="52" rx="8"/>
  <text class="t" x="180" y="512" text-anchor="middle">b = b &#215; b</text>
  <text class="t" x="180" y="532" text-anchor="middle">n = n // 2</text>

  <polyline points="90,516 45,516 45,235 93,235" marker-end="url(#a)"/>
  <text class="lbl" x="20" y="380">loop</text>

  <ellipse class="term" cx="180" cy="608" rx="105" ry="23"/>
  <text class="t" x="180" y="613" text-anchor="middle">Return result</text>

  <rect class="pan" x="500" y="52" width="480" height="586" rx="10"/>

  <text class="sub" x="520" y="80">Why squaring, not n multiplications</text>
  <text class="t" x="520" y="106">Elodie's culture doubles every hour. After 13 hours</text>
  <text class="t" x="520" y="128">the growth factor is 2 to the 13th.</text>
  <text class="t" x="520" y="156">13 in binary is 1101, that is 8 + 4 + 1, so</text>
  <text class="t" x="540" y="178">2^13 = 2^8 &#215; 2^4 &#215; 2^1</text>
  <text class="t" x="520" y="206">The loop builds b, b&#178;, b&#8308;, b&#8312;, ... one squaring at a</text>
  <text class="t" x="520" y="228">time, and multiplies in only those whose binary digit</text>
  <text class="t" x="520" y="250">is 1. The odd test reads that digit; n // 2 moves on.</text>

  <text class="sub" x="520" y="288">Rounds needed</text>
  <line class="rule" x1="520" y1="298" x2="950" y2="298"/>
  <text class="hd" x="520" y="318">exponent n</text>
  <text class="hd" x="690" y="318">one at a time</text>
  <text class="hd" x="860" y="318">by squaring</text>
  <line class="rule" x1="520" y1="326" x2="950" y2="326"/>
  <text class="cell" x="520" y="346">13</text>
  <text class="cell" x="690" y="346">13</text>
  <text class="cell" x="860" y="346">4</text>
  <text class="cell" x="520" y="368">1 000</text>
  <text class="cell" x="690" y="368">1 000</text>
  <text class="cell" x="860" y="368">10</text>
  <text class="cell" x="520" y="390">1 000 000</text>
  <text class="cell" x="690" y="390">1 000 000</text>
  <text class="cell" x="860" y="390">20</text>
  <line class="rule" x1="520" y1="402" x2="950" y2="402"/>

  <text class="sub" x="520" y="440">Why this matters for accuracy</text>
  <text class="t" x="520" y="466">Every multiplication rounds. Doing about log2(n) of</text>
  <text class="t" x="520" y="488">them instead of n keeps whole-number powers exact:</text>
  <text class="t" x="520" y="510">2 to the 10 comes back as 1024.0, not 1023.9999998.</text>
  <text class="t" x="520" y="538">This is why Algorithm B splits x = n + f and sends</text>
  <text class="t" x="520" y="560">only the fractional part f through a series.</text>
  <text class="t" x="520" y="588">D2 calls pow_int twice, on two halves of n, so that a</text>
  <text class="t" x="520" y="610">very small or very large a can compensate a power</text>
  <text class="t" x="520" y="632">that would leave the representable range (DC-04).</text>
</svg>
